name: Incorrect finding (false positive)
description: Prodgate flagged a change that is actually safe
labels: ["false-positive"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach a raw production plan. Terraform plan JSON can contain plaintext
        secrets. Share only the fields below and a minimal, sanitized reproduction.

        The quickest safe way to fill this in is
        `prodgate diagnostics plan.json --finding <ruleId>`, which prints only rule
        ids, resource types, actions, and normalized evidence. See the redaction guide
        in docs/reporting.md.
  - type: input
    id: version
    attributes:
      label: Prodgate version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: rule-id
    attributes:
      label: Rule ID
      placeholder: "PG-AWS-RDS-PUBLIC"
    validations:
      required: true
  - type: input
    id: policy-digest
    attributes:
      label: Policy digest
      placeholder: "sha256:..."
  - type: input
    id: resource-type
    attributes:
      label: Resource type
      placeholder: "aws_db_instance"
    validations:
      required: true
  - type: dropdown
    id: action
    attributes:
      label: Terraform action
      options: [create, update, delete, replace]
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      placeholder: "No finding, or a warning instead of a critical."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal sanitized reproduction
      description: A small resource_changes snippet with values redacted, if you can share one.
