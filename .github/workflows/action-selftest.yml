name: Action self-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      # Safe plan: the gate passes and reports allowed.
      - run: cp test/fixtures/create-only.json plan.json
      - id: safe
        uses: ./
        with:
          plan-json: plan.json
      - name: Assert safe outcome and outputs resolve
        run: |
          test "${{ steps.safe.outputs.execution-outcome }}" = "allowed"
          test "${{ steps.safe.outputs.policy-verdict }}" = "pass"
          test "${{ steps.safe.outputs.exit-code }}" = "0"
          test "${{ steps.safe.outputs.engine-version }}" != ""
          test "${{ steps.safe.outputs.plan-hash }}" != ""

      # Critical plan in audit mode: reports what would block without failing.
      - run: cp test/fixtures/delete-db.json plan.json
      - id: audit
        uses: ./
        with:
          plan-json: plan.json
          mode: audit
      - name: Assert audit reports without blocking
        run: |
          test "${{ steps.audit.outputs.execution-outcome }}" = "reported"
          test "${{ steps.audit.outputs.would-block }}" = "true"
          test "${{ steps.audit.outputs.critical-count }}" = "1"
          test "${{ steps.audit.outputs.exit-code }}" = "0"

      # Critical plan in enforce mode: the step fails, and reports blocked.
      - id: enforce
        continue-on-error: true
        uses: ./
        with:
          plan-json: plan.json
      - name: Assert enforce blocks
        run: |
          test "${{ steps.enforce.outcome }}" = "failure"
          test "${{ steps.enforce.outputs.execution-outcome }}" = "blocked"
          test "${{ steps.enforce.outputs.exit-code }}" = "1"

      # Invalid input: the step fails with an evaluation error (exit 2), distinct from
      # a policy block (exit 1). The exit-code output must still be published.
      - run: echo '{}' > plan.json
      - id: invalid
        continue-on-error: true
        uses: ./
        with:
          plan-json: plan.json
      - name: Assert invalid input fails with exit 2
        run: |
          test "${{ steps.invalid.outcome }}" = "failure"
          test "${{ steps.invalid.outputs.exit-code }}" = "2"
