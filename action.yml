name: 'Prodgate'
description: 'Block destructive infrastructure changes in a Terraform plan before they ship'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  plan-json:
    description: 'Path to a `terraform show -json` plan file'
    required: true
  mode:
    description: 'Enforcement mode: audit or enforce'
    required: false
    default: 'enforce'
  fail-on:
    description: 'Block on: critical, warning, or never'
    required: false
    default: 'critical'
  github-token:
    description: 'Token used to post the PR comment'
    required: false
    default: ${{ github.token }}

outputs:
  policy-verdict:
    description: 'pass or fail from the findings and fail-on threshold'
    value: ${{ steps.prodgate.outputs.policy-verdict }}
  would-block:
    description: 'true if this would block a merge in enforce mode'
    value: ${{ steps.prodgate.outputs.would-block }}
  execution-outcome:
    description: 'allowed, blocked, reported, or overridden'
    value: ${{ steps.prodgate.outputs.execution-outcome }}
  enforcement-mode:
    description: 'audit or enforce'
    value: ${{ steps.prodgate.outputs.enforcement-mode }}
  exit-code:
    description: '0 = allowed/reported, 1 = policy block, 2 = input/configuration/tool error'
    value: ${{ steps.prodgate.outputs.exit-code }}
  critical-count:
    description: 'Number of critical findings'
    value: ${{ steps.prodgate.outputs.critical-count }}
  warning-count:
    description: 'Number of warning findings'
    value: ${{ steps.prodgate.outputs.warning-count }}
  plan-hash:
    description: 'sha256 of the evaluated plan'
    value: ${{ steps.prodgate.outputs.plan-hash }}
  policy-digest:
    description: 'sha256 of the effective policy'
    value: ${{ steps.prodgate.outputs.policy-digest }}
  report-path:
    description: 'Path to the written Markdown report'
    value: ${{ steps.prodgate.outputs.report-path }}
  engine-version:
    description: 'Prodgate version that produced the result'
    value: ${{ steps.prodgate.outputs.engine-version }}

runs:
  using: 'composite'
  steps:
    - name: Collect agent-detection signals
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        # Only the PR's own commits, not base-branch history, so a co-author trailer
        # elsewhere in the base branch does not flag every PR. Needs fetch-depth: 0.
        if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
          git log --format='%B' "$BASE_SHA..$HEAD_SHA" > "$RUNNER_TEMP/prodgate-commits.txt" 2>/dev/null || true
        else
          git log --format='%B' -n 50 HEAD > "$RUNNER_TEMP/prodgate-commits.txt" 2>/dev/null || true
        fi

    - name: Clear a stale override label after a new commit
      if: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}
      continue-on-error: true
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          // Best-effort cleanup so the label does not linger visually after a new
          // commit. Enforcement does not depend on this: the override is honored only
          // in the run triggered by the labeled event (see PRODGATE_OVERRIDE below), so
          // a leftover label on a later event grants nothing, and a fork PR's read-only
          // 403 here is harmless.
          const { owner, repo } = context.repo
          try {
            await github.rest.issues.removeLabel({ owner, repo, issue_number: context.issue.number, name: 'prodgate-approved' })
          } catch (e) {
            if (e.status !== 404) throw e
          }

    - name: Run Prodgate
      id: prodgate
      shell: bash
      env:
        PLAN_JSON: ${{ inputs.plan-json }}
        MODE: ${{ inputs.mode }}
        FAIL_ON: ${{ inputs.fail-on }}
        PRODGATE_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        PRODGATE_BRANCH: ${{ github.head_ref }}
        PRODGATE_PR_BODY: ${{ github.event.pull_request.body }}
        # The override is honored only in the run triggered by adding the
        # prodgate-approved label. Any other event (open, reopen, synchronize, re-run)
        # is not an override, so a stale label cannot pass a plan that was not just
        # labeled. After a new commit the label must be removed and re-added.
        PRODGATE_OVERRIDE: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'prodgate-approved' }}
        PRODGATE_OVERRIDE_LABEL: 'prodgate-approved'
        PRODGATE_OVERRIDE_ACTOR: ${{ github.actor }}
        PRODGATE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Pass the plan path through the environment rather than templating it into the
      # command, so a crafted path cannot inject shell.
      run: |
        set +e
        # Run the bundle committed with this action tag, so the tag always runs the
        # exact engine it shipped with rather than resolving a mutable npm range.
        node "$GITHUB_ACTION_PATH/action/index.js" check "$PLAN_JSON" \
          --mode "$MODE" \
          --fail-on "$FAIL_ON" \
          --commits-file "$RUNNER_TEMP/prodgate-commits.txt" \
          --github --output "$RUNNER_TEMP/prodgate.md" \
          --outputs-file "$GITHUB_OUTPUT" \
          2> "$RUNNER_TEMP/prodgate-error.txt"
        code=$?
        cat "$RUNNER_TEMP/prodgate-error.txt" >&2 || true
        # On an input or configuration error the CLI exits before writing a report, so
        # the previous comment would otherwise sit there describing a plan that was
        # never evaluated. Replace it with the error instead of leaving it stale.
        if [ "$code" = "2" ]; then
          {
            echo "## Prodgate Infrastructure Change Check: ERROR"
            echo
            echo "Prodgate could not evaluate this plan, so no policy decision was made."
            echo "This is not a statement that the change is safe."
            echo
            echo '```'
            head -c 2000 "$RUNNER_TEMP/prodgate-error.txt" 2>/dev/null || echo "See the workflow log for details."
            echo '```'
          } > "$RUNNER_TEMP/prodgate.md"
        fi
        # Always publish the exit code, even on an input error (exit 2) where the CLI
        # exits before writing its outputs, so consumers can tell a policy block (1)
        # from a tool or input failure (2).
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

    - name: Post or update PR comment
      if: ${{ github.event_name == 'pull_request' }}
      # Fork PRs run with a read-only token; commenting 403s. Do not fail a passing
      # (or failing) verdict on the comment step; the check status is still set below.
      continue-on-error: true
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs')
          let body
          try { body = fs.readFileSync(process.env.RUNNER_TEMP + '/prodgate.md', 'utf8') } catch { return }
          const marker = '<!-- prodgate -->'
          body = `${marker}\n${body}`
          const { owner, repo } = context.repo
          const issue_number = context.issue.number
          // Paginate: on a busy PR the marker comment can be past the first page, and
          // missing it would post a duplicate instead of updating.
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 })
          const existing = comments.find(c => c.body && c.body.includes(marker))
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body })
          }

    - name: Set the check status
      shell: bash
      env:
        EXIT_CODE: ${{ steps.prodgate.outputs.exit_code }}
      run: |
        case "$EXIT_CODE" in
          0) exit 0 ;;
          1)
            echo "Prodgate blocked this plan because the configured policy failed. Add the 'prodgate-approved' label to record a manual override."
            exit 1
            ;;
          2)
            echo "Prodgate could not evaluate this plan because of an input or configuration error."
            exit 2
            ;;
          *)
            echo "Prodgate failed unexpectedly with exit code $EXIT_CODE."
            exit "$EXIT_CODE"
            ;;
        esac
