name: 'Prodgate'
description: 'Block destructive infrastructure changes in a Terraform plan before they ship'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  plan-json:
    description: 'Path to a `terraform show -json` plan file'
    required: true
  strict:
    description: 'Also fail on warnings'
    required: false
    default: 'false'
  github-token:
    description: 'Token used to post the PR comment'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Collect agent-detection signals
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        # Only the PR's own commits, not base-branch history, so a co-author trailer
        # elsewhere in the base branch does not flag every PR. Needs fetch-depth: 0.
        if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
          git log --format='%B' "$BASE_SHA..$HEAD_SHA" > "$RUNNER_TEMP/prodgate-commits.txt" 2>/dev/null || true
        else
          git log --format='%B' -n 50 HEAD > "$RUNNER_TEMP/prodgate-commits.txt" 2>/dev/null || true
        fi

    - name: Reset approval on new commits
      if: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}
      continue-on-error: true
      uses: actions/github-script@v9
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          // Best-effort cleanup: clear the stale label after a new commit so the PR
          // reads correctly. Enforcement does not depend on this (the approval step
          // fails closed on synchronize), so a fork PR's read-only-token 403 is fine.
          const { owner, repo } = context.repo
          try {
            await github.rest.issues.removeLabel({ owner, repo, issue_number: context.issue.number, name: 'prodgate-approved' })
          } catch (e) {
            if (e.status !== 404) throw e // 404 = label was not present, nothing to reset
          }

    - name: Resolve approval from live labels
      id: approval
      if: ${{ github.event_name == 'pull_request' }}
      uses: actions/github-script@v9
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          // Enforcement lives here (a read + logic), not in the label-removal step
          // above (a write that 403s on fork PRs). On a new commit the plan changed,
          // so any prior approval is stale regardless of label state: fail closed.
          if (context.payload.action === 'synchronize') { core.setOutput('approved', 'false'); return }
          // Otherwise read labels live from the API rather than the event payload, so
          // adding the label and re-running passes the gate without a new commit.
          const { owner, repo } = context.repo
          const { data } = await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number: context.issue.number })
          const approved = data.some(l => l.name === 'prodgate-approved')
          core.setOutput('approved', approved ? 'true' : 'false')

    - name: Run Prodgate
      id: prodgate
      shell: bash
      env:
        PRODGATE_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        PRODGATE_BRANCH: ${{ github.head_ref }}
        PRODGATE_PR_BODY: ${{ github.event.pull_request.body }}
        PRODGATE_APPROVED: ${{ steps.approval.outputs.approved }}
      run: |
        set +e
        npx --yes prodgate@^1 check "${{ inputs.plan-json }}" \
          ${{ inputs.strict == 'true' && '--strict' || '' }} \
          --commits-file "$RUNNER_TEMP/prodgate-commits.txt" \
          --github --output "$RUNNER_TEMP/prodgate.md"
        echo "exit_code=$?" >> "$GITHUB_OUTPUT"

    - name: Post or update PR comment
      if: ${{ github.event_name == 'pull_request' }}
      # Fork PRs run with a read-only token; commenting 403s. Do not fail a passing
      # (or failing) verdict on the comment step; the check status is still set below.
      continue-on-error: true
      uses: actions/github-script@v9
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs')
          let body
          try { body = fs.readFileSync(process.env.RUNNER_TEMP + '/prodgate.md', 'utf8') } catch { return }
          const marker = '<!-- prodgate -->'
          body = `${marker}\n${body}`
          const { owner, repo } = context.repo
          const issue_number = context.issue.number
          const comments = await github.rest.issues.listComments({ owner, repo, issue_number })
          const existing = comments.data.find(c => c.body && c.body.includes(marker))
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body })
          }

    - name: Fail the check if the gate triggered
      shell: bash
      run: |
        if [ "${{ steps.prodgate.outputs.exit_code }}" != "0" ]; then
          echo "Prodgate blocked this plan. Add the 'prodgate-approved' label to override."
          exit 1
        fi
